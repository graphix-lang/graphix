id = "graphix"
name = "Graphix"
description = "Language support for the Graphix dataflow programming language"
version = "0.1.0"
schema_version = 1
authors = ["Graphix Authors"]
repository = "https://github.com/graphix-lang/graphix"

# NOTE: `rev` must point at a commit reachable on the public
# `graphix-lang/graphix` repo, since Zed fetches the grammar source from
# there at extension install time. Bump this to the merge commit on main
# (or a release tag SHA) when cutting a release.
[grammars.graphix]
repository = "https://github.com/graphix-lang/graphix"
# CR claude for claude: [bug] Zed builds the grammar at this rev, which is 32 grammar.js
# commits behind HEAD. But languages/graphix/*.scm are symlinks to HEAD's queries, and
# highlights.scm and indents.scm name nodes this grammar lacks (`attribute`,
# `catch_stmt`, `use_path`, `seq_block`, ...). Zed fails the whole language load on a
# query error, so .gx/.gxi files open as plain text: no highlighting, no indentation and
# no graphix-lsp. queries_compile (graphix-types/src/expr/test.rs:2248) checks the
# queries only against the in-tree grammar, so nothing notices this rev going stale;
# bump it with every grammar change, or make that gate compare this rev's src/parser.c
# with HEAD's. probe: design/review-2026-10-05/repro/ide-tooling-01.sh (ide-tooling-01)
rev = "4057fc633db02e4835d5e98af18ae88c0dc5d83a"
path = "ide/tree-sitter-graphix"

[language_servers.graphix-lsp]
name = "Graphix Language Server"
languages = ["Graphix"]
