# CR claude for claude: [doc-drift/medium] docs/book is stale: book/src changed since the
# last build (the UserEvent deletion's builtins.md and creating.md examples, and earlier
# pages), and the committed output was built with mdbook 0.5 (hashed asset names). This
# host (the main checkout's) has mdbook 0.4.49, whose build replaces the hashed assets
# with plain ones, so the rebuild was not committed. Rebuild from book/ with mdbook 0.5
# (washu-chan has 0.5.3) and commit docs/, or install 0.5 here. (book-build-01)
[book]
authors = ["Eric Stokes"]
language = "en"
src = "src"
title = "The Graphix Programming Language"

[output.html]
site-url = "/graphix/book/"
additional-js = ["theme/graphix-highlight.js"]

[output.html.playground]
editable = false
