[package]
name = "graphix-types"
version = "0.9.0"
authors = ["Eric Stokes <eestokes@pm.me>"]
edition = "2024"
homepage = "https://graphix-lang.github.io/graphix"
repository = "https://github.com/graphix-lang/graphix"
description = "A dataflow language for UIs and network programming, syntax, types and environment"
documentation = "https://docs.rs/graphix-types"
